name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  workflow_dispatch:

permissions:
  contents: read
  security-events: write # Allows uploading SARIF security reports to GitHub Security tab

jobs:
  # =========================================================================
  # 1. SECRET DETECTION (Gitleaks)
  # =========================================================================
  secret-scan:
    name: 🛡️ Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git commit history for deep secret detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # =========================================================================
  # 2. DEPENDENCY VULNERABILITY AUDIT (SCA)
  # =========================================================================
  dependency-scan:
    name: 📦 Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm audit --audit-level=high || true

      - name: Audit Chat Server Dependencies
        run: |
          cd chat/server
          npm audit --audit-level=high || true

      - name: Audit Frontend Apps Dependencies
        run: |
          cd admin && npm audit --audit-level=high || true
          cd ../frontend && npm audit --audit-level=high || true
          cd ../chat/client && npm audit --audit-level=high || true

      - name: Run Trivy Filesystem Scan (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true # fails on private repos without GHAS
        with:
          sarif_file: "trivy-fs-results.sarif"
 
      - name: Keep SARIF as artifact (fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-sarif
          path: trivy-fs-results.sarif
          if-no-files-found: ignore

  # =========================================================================
  # 3. STATIC APPLICATION SECURITY TESTING (SAST)
  # =========================================================================
  sast:
    name: 🔍 Static Code Analysis (Semgrep SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep Security Rules
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            returntocorp/semgrep semgrep \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/javascript" \
            --sarif --output /src/semgrep.sarif /src

      - name: Upload Semgrep SARIF Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true # fails on private repos without GHAS
        with:
          sarif_file: "semgrep.sarif"

      - name: Keep SARIF as artifact (fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  # =========================================================================
  # 4. CODE QUALITY & STATIC CODE ANALYSIS (Linting & Standards)
  # =========================================================================
  code-quality:
    name: 🎨 Code Quality Analysis (ESLint & Standards)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            chat/server/package-lock.json
            admin/package-lock.json
            frontend/package-lock.json
            chat/client/package-lock.json

      - name: Code Quality - Backend Linter & Syntax
        working-directory: ./backend
        run: |
          npm ci
          npm run lint

      - name: Code Quality - Admin UI (ESLint)
        working-directory: ./admin
        run: |
          npm ci
          npm run lint || true

      - name: Code Quality - Customer Frontend (ESLint)
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint || true

      - name: Code Quality - Chat Client (ESLint)
        working-directory: ./chat/client
        run: |
          npm ci
          npm run lint || true

      - name: code Quality - chat server (ESLint)
        working-directory: ./chat/server
        run: |
          npm ci
          npm run lint || true

  # =========================================================================
  # 5. AUTOMATED TESTS & CODE COVERAGE
  # =========================================================================
  test:
    name: 🧪 Automated Tests & Coverage
    needs: [secret-scan, code-quality]
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpassword
          MONGO_INITDB_DATABASE: citybites_test
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests & Coverage
        working-directory: ./backend
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key_12345
          STRIPE_SECRET_KEY: sk_test_dummy
          MONGO_URI: mongodb://testuser:testpassword@localhost:27017/citybites_test?authSource=admin
          NODE_OPTIONS: --experimental-vm-modules

      - name: Run Chat Server Tests
        working-directory: ./chat/server
        run: |
          npm ci
          npm test || true

      - name: Run Admin UI Tests
        working-directory: ./admin
        run: |
          npm ci
          npm test -- --watchAll=false || true

      - name: Run Customer Frontend Tests
        working-directory: ./frontend
        run: |
          npm ci
          npm test -- --watchAll=false || true

      - name: Run Chat Client Tests
        working-directory: ./chat/client
        run: |
          npm ci
          npm test -- --watchAll=false || true

      - name: Upload Backend Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore

  # =========================================================================
  # 6. SONARQUBE STATIC ANALYSIS & CODE QUALITY
  # =========================================================================
  sonarqube:
    name: 📊 SonarQube Code Quality & Security Scan
    needs: [test]
    runs-on: ubuntu-latest

    env:
      RUN_SONAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git commit history for accurate blame and change analysis

      - name: Download Backend Coverage Report
        if: env.RUN_SONAR == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-coverage
          path: backend/coverage

      # Fix lcov paths (relative to repo root) that means 
      - name: Fix lcov paths (relative to repo root)
        if: env.RUN_SONAR == 'true'
        run: |
          if [ -f backend/coverage/lcov.info ]; then
            sed -i 's#^SF:\(\.\?/\?\)\(backend/\)\?#SF:backend/#' backend/coverage/lcov.info
            head -3 backend/coverage/lcov.info
          fi
 

      - name: Run SonarQube Scan
        if: env.RUN_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Quality gate
        if: env.RUN_SONAR == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # =========================================================================
  # 7. DOCKERFILE LINTING & MULTI-CONTAINER SECURITY SCAN
  # =========================================================================
  container-security:
    name: 🐳 Container Lint & Trivy Image Scan
    needs: [test, sonarqube]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: backend
            context: ./backend
          - name: chat-server
            context: ./chat/server
          - name: admin
            context: ./admin
          - name: frontend
            context: ./frontend
          - name: chat-client
            context: ./chat/client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Hadolint (Dockerfile Linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service.context }}/Dockerfile
          failure-threshold: warning

      - name: Build Docker Image
        run: |
          docker build -t local/${{ matrix.service.name }}:test ${{ matrix.service.context }}

      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "local/${{ matrix.service.name }}:test"
          format: "sarif"
          output: "trivy-image-${{ matrix.service.name }}.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy Container Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-image-${{ matrix.service.name }}.sarif"

  # =========================================================================
  # 8. DOCKER BUILD & PUSH TO DOCKER HUB
  # =========================================================================
  docker-push:
    name: 🐳 Docker Build & Push (${{ matrix.service.name }})
    needs: [container-security, dependency-scan, sast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: backend, context: ./backend }
          - { name: chat-server, context: ./chat/server }
          - { name: admin, context: ./admin }
          - { name: frontend, context: ./frontend }
          - { name: chat-client, context: ./chat/client }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
      


          
  
