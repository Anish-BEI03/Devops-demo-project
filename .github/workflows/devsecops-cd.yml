# Runs only after successfully running DevSecOps CI Pipeline file push and git tag v* into docker hub
# Run only on main branch
# Triggered by workflow_run from DevSecOps CI Pipeline

name: CD Deploy to AWS EC2 (Main)

on:
  workflow_run:
    workflows: ["DevSecOps CI Pipeline"]
    branches: [main]
    types: [completed]

  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Terraform + Docker Compose deploy
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set commit tag output
        id: tag
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ./Terraform
        run: terraform init

      - name: Terraform validate
        working-directory: ./Terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: ./Terraform
        env:
          TF_VAR_ssh_public_key: ${{ secrets.AWS_SSH_KEY }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        id: tf
        working-directory: ./Terraform
        env:
          TF_VAR_ssh_public_key: ${{ secrets.AWS_SSH_KEY }}
        run: |
          terraform apply -input=false -auto-approve tfplan
          echo "ip=$(terraform output -raw webserver_public_ip)" >> "$GITHUB_OUTPUT"
          echo "dns=$(terraform output -raw webserver_public_dns_name)" >> "$GITHUB_OUTPUT"

      - name: Write runtime .env
        env:
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          MONGO_INITDB_ROOT_USERNAME: ${{ vars.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_DATABASE: ${{ vars.MONGO_INITDB_DATABASE }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.tag.outputs.tag }}
          PUBLIC_IP: ${{ steps.tf.outputs.ip }}
        run: |
          mkdir -p deploy
          umask 077
          DOCKERHUB_USERNAME=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          cat <<EOF > deploy/.env
          DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME
          TAG=$TAG
          PUBLIC_IP=$PUBLIC_IP
          JWT_SECRET=$JWT_SECRET
          STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
          MONGO_INITDB_ROOT_USERNAME=$MONGO_INITDB_ROOT_USERNAME
          MONGO_INITDB_DATABASE=$MONGO_INITDB_DATABASE
          MONGO_INITDB_ROOT_PASSWORD=$MONGO_INITDB_ROOT_PASSWORD
          EOF

      - name: Deploy with Docker Compose over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          IP: ${{ steps.tf.outputs.ip }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          SSH="ssh $OPTS ubuntu@$IP"

          # Wait for SSH to become ready
          echo "Waiting for SSH to be ready on $IP..."
          for i in $(seq 1 30); do
            if $SSH true; then
              echo "SSH connected successfully!"
              break
            fi
            echo "Waiting for ssh ($i/30)..."
            sleep 10
          done

          # Wait for cloud-init (user_data docker.sh) to finish installing Docker
          echo "Waiting for cloud-init (Docker installation) to complete..."
          $SSH 'if command -v cloud-init >/dev/null 2>&1; then sudo cloud-init status --wait; fi'

          # Ensure docker socket permissions are active for the ubuntu user
          $SSH 'sudo systemctl enable --now docker && sudo usermod -aG docker ubuntu && sudo chmod 666 /var/run/docker.sock'

          $SSH 'mkdir -p ~/app'
          scp $OPTS deploy/docker-compose.yml deploy/.env ubuntu@$IP:~/app/

          # Log in to Docker Hub if credentials provided
          if [ -n "${DOCKERHUB_TOKEN:-}" ] && [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | $SSH "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"
          fi

          # Pull images with fallback to latest tag if commit SHA tag is missing
          $SSH 'cd ~/app && if ! docker compose pull; then
            echo "Failed pulling with commit tag; falling back to :latest..."
            sed -i "s/^TAG=.*/TAG=latest/" ~/app/.env
            docker compose pull
          fi'

          $SSH 'cd ~/app && docker compose up -d --remove-orphans && docker image prune -f && docker compose ps'

          # Wait for application services to start responding on EC2
          echo "Waiting for web application to start responding..."
          $SSH 'for i in $(seq 1 20); do
            if curl -s -f http://localhost:80/ >/dev/null 2>&1 || curl -s -f http://localhost:5174/ >/dev/null 2>&1; then
              echo "Web container is up and responding locally!"
              break
            fi
            echo "Waiting for frontend service ($i/20)..."
            sleep 4
          done || (echo "Container logs:" && cd ~/app && docker compose logs --tail 30)'

      - name: Smoke test
        run: |
          IP="${{ steps.tf.outputs.ip }}"
          echo "Running smoke test on http://$IP/ ..."
          curl -fsvS --retry 15 --retry-delay 5 --retry-connrefused --max-time 15 \
            "http://$IP/" -o /dev/null
          echo "Successfully verified deployment at http://$IP/"
