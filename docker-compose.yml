services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: citybites-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: group_48
      MONGO_INITDB_ROOT_PASSWORD: 291381
      MONGO_INITDB_DATABASE: citybites
    volumes:
      - mongodb_data:/data/db
    networks:
      - devops-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: citybites-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://group_48:291381@mongodb:27017/citybites?authSource=admin
      MONGO_URI: ${MONGO_URI:-mongodb://group_48:291381@mongodb:27017/citybites?authSource=admin}
      JWT_SECRET: FzNsyEVHfWuButtLqXHDhbYkksaxYHfmQWP6m6rMgsx
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_test_dummy}
      EMAIL_SERVICE: gmail
      EMAIL_USER: amandawijesinghe2001@gmail.com
      EMAIL_PASS: gwqw aouz pzgw tcaj
      EMAIL_FROM: noreply@citybites.com
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    networks:
      - devops-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:4000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Chat Server (Socket.io)
  chat-server:
    build:
      context: ./chat/server
      dockerfile: Dockerfile
    container_name: citybites-chat-server
    restart: always
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGODB_URI: mongodb+srv://group_48:291381@cluster0.ixyx7h7.mongodb.net/ChatApp
      JWT_SECRET: yFzNsyEVHfWuButtLqXHDhbYkksaxYHfmQWP6m6rMgsx
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./chat/server:/app
      - /app/node_modules
    networks:
      - devops-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5001/api/status || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin Panel (React/Vite)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: citybites-admin
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:4000
    depends_on:
      - backend
    volumes:
      - ./admin:/app
      - /app/node_modules
    networks:
      - devops-network

  # Frontend (React/Vite) - Customer App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citybites-frontend
    restart: always
    ports:
      - "5174:5174"
    environment:
      VITE_BACKEND_URL: http://localhost:4000
      VITE_CHAT_URL: http://localhost:5172
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - devops-network

  # Chat Client (React/Vite)
  chat-client:
    build:
      context: ./chat/client
      dockerfile: Dockerfile
    container_name: citybites-chat-client
    restart: always
    ports:
      - "5172:5172"
    environment:
      VITE_BACKEND_URL: http://localhost:5001
    depends_on:
      - chat-server
    volumes:
      - ./chat/client:/app
      - /app/node_modules
    networks:
      - devops-network



volumes:
  mongodb_data:
  backend_uploads:

networks:
  devops-network:
    driver: bridge

